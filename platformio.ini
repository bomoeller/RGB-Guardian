[env:controller]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
upload_port = COM25
monitor_port = COM25
monitor_speed = 115200
monitor_filters = direct
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    fastled/FastLED@^3.6.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<controller.cpp>

[env:player-2]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
upload_port = COM26
monitor_port = COM26
monitor_speed = 115200
monitor_filters = direct
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<player-2.cpp>

