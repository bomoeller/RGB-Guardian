<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .wire { stroke: #000; stroke-width: 2; fill: none; }
      .wire-power { stroke: #c00; stroke-width: 2.5; fill: none; }
      .wire-gnd { stroke: #000; stroke-width: 2.5; fill: none; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #000; }
      .text-small { font-family: Arial, sans-serif; font-size: 12px; fill: #000; }
      .text-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #000; }
      .text-red { fill: #c00; }
      .text-green { fill: #0a0; }
      .text-blue { fill: #00c; }
      .resistor { fill: none; stroke: #000; stroke-width: 2; }
      .led { fill: none; stroke: #000; stroke-width: 2; }
      .transistor { fill: none; stroke: #000; stroke-width: 2; }
      .component-box { fill: #f0f0f0; stroke: #000; stroke-width: 1.5; rx: 5; }
      .power-box { fill: #ffe0e0; stroke: #c00; stroke-width: 2; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="text-title">RGB Guardian - 4x Button LED Driver Circuit (12V)</text>
  <text x="600" y="50" text-anchor="middle" class="text-small">Components: 4x 2N5551, 4x 1kΩ, 4x 330Ω, 12V 1A PSU</text>
  
  <!-- ESP32-C3 Box -->
  <rect x="50" y="100" width="180" height="550" class="component-box"/>
  <text x="140" y="125" text-anchor="middle" class="text" font-weight="bold">ESP32-C3</text>
  <text x="140" y="145" text-anchor="middle" class="text" font-weight="bold">SuperMini</text>
  
  <!-- GPIO Labels -->
  <text x="70" y="220" class="text">GPIO5</text>
  <circle cx="210" cy="215" r="3" fill="#000"/>
  
  <text x="70" y="320" class="text">GPIO6</text>
  <circle cx="210" cy="315" r="3" fill="#000"/>
  
  <text x="70" y="420" class="text">GPIO7</text>
  <circle cx="210" cy="415" r="3" fill="#000"/>
  
  <text x="70" y="520" class="text">GPIO8</text>
  <circle cx="210" cy="515" r="3" fill="#000"/>
  
  <text x="70" y="600" class="text" font-weight="bold">GND</text>
  <circle cx="210" cy="595" r="3" fill="#000"/>
  
  <!-- 12V Power Supply Box -->
  <rect x="950" y="100" width="200" height="120" class="power-box"/>
  <text x="1050" y="130" text-anchor="middle" class="text" font-weight="bold">12V Power Supply</text>
  <text x="1050" y="150" text-anchor="middle" class="text-small">(1A minimum)</text>
  
  <text x="980" y="180" class="text-red" font-weight="bold">+12V</text>
  <circle cx="1120" cy="175" r="3" fill="#c00"/>
  
  <text x="980" y="205" class="text" font-weight="bold">GND</text>
  <circle cx="1120" cy="200" r="3" fill="#000"/>
  
  <!-- Ground connection warning -->
  <rect x="350" y="680" width="500" height="80" fill="#fff8e0" stroke="#f80" stroke-width="2" rx="5"/>
  <text x="600" y="705" text-anchor="middle" class="text" font-weight="bold" fill="#f80">CRITICAL: COMMON GROUND!</text>
  <text x="600" y="725" text-anchor="middle" class="text-small">Connect ESP32 GND to 12V Supply GND</text>
  <text x="600" y="745" text-anchor="middle" class="text-small">Do NOT connect +12V to ESP32! Only to LED circuits!</text>
  
  <!-- Button 1 - RED LED Circuit -->
  <g id="button1">
    <!-- 1k Base Resistor -->
    <line x1="210" y1="215" x2="260" y2="215" class="wire"/>
    <rect x="260" y="205" width="50" height="20" class="resistor" fill="#fff"/>
    <text x="285" y="195" text-anchor="middle" class="text-small">1kΩ</text>
    
    <!-- Wire to transistor base -->
    <line x1="310" y1="215" x2="390" y2="215" class="wire"/>
    
    <!-- 2N5551 Transistor Symbol -->
    <circle cx="410" cy="215" r="25" class="transistor"/>
    <line x1="400" y1="200" x2="400" y2="230" class="transistor"/>
    <line x1="398" y1="215" x2="390" y2="215" class="wire"/>
    <line x1="400" y1="205" x2="425" y2="185" class="transistor"/>
    <line x1="400" y1="225" x2="425" y2="245" class="transistor"/>
    <polygon points="422,188 425,185 420,183" fill="#000"/>
    
    <!-- Transistor labels -->
    <text x="375" y="218" text-anchor="end" class="text-small">B</text>
    <text x="445" y="185" class="text-small">C</text>
    <text x="445" y="250" class="text-small">E</text>
    
    <!-- Emitter to GND -->
    <line x1="425" y1="245" x2="425" y2="595" class="wire-gnd"/>
    
    <!-- Collector to LED -->
    <line x1="425" y1="185" x2="660" y2="185" class="wire"/>
    
    <!-- LED Symbol -->
    <line x1="660" y1="175" x2="660" y2="195" class="led"/>
    <line x1="650" y1="175" x2="670" y2="185" class="led"/>
    <line x1="650" y1="195" x2="670" y2="185" class="led"/>
    <polygon points="650,175 650,195 670,185" fill="none" stroke="#000" stroke-width="2"/>
    <text x="680" y="190" class="text-small text-red" font-weight="bold">RED</text>
    <text x="755" y="190" class="text-small">LED</text>
    
    <!-- LED to 330Ω Resistor -->
    <line x1="660" y1="175" x2="660" y2="155" class="wire"/>
    <rect x="640" y="105" width="40" height="50" class="resistor" fill="#fff" transform="rotate(90 660 130)"/>
    <text x="695" y="135" class="text-small">330Ω</text>
    
    <!-- 330Ω to +12V -->
    <line x1="660" y1="105" x2="660" y2="70" class="wire-power"/>
    <line x1="660" y1="70" x2="1100" y2="70" class="wire-power"/>
    <line x1="1100" y1="70" x2="1100" y2="175" class="wire-power"/>
    <line x1="1100" y1="175" x2="1120" y2="175" class="wire-power"/>
    
    <!-- Button Label -->
    <text x="800" y="190" class="text-small" font-weight="bold">Button 1</text>
  </g>
  
  <!-- Button 2 - GREEN LED Circuit -->
  <g id="button2">
    <!-- 1k Base Resistor -->
    <line x1="210" y1="315" x2="260" y2="315" class="wire"/>
    <rect x="260" y="305" width="50" height="20" class="resistor" fill="#fff"/>
    <text x="285" y="295" text-anchor="middle" class="text-small">1kΩ</text>
    
    <!-- Wire to transistor base -->
    <line x1="310" y1="315" x2="390" y2="315" class="wire"/>
    
    <!-- 2N5551 Transistor Symbol -->
    <circle cx="410" cy="315" r="25" class="transistor"/>
    <line x1="400" y1="300" x2="400" y2="330" class="transistor"/>
    <line x1="398" y1="315" x2="390" y2="315" class="wire"/>
    <line x1="400" y1="305" x2="425" y2="285" class="transistor"/>
    <line x1="400" y1="325" x2="425" y2="345" class="transistor"/>
    <polygon points="422,288 425,285 420,283" fill="#000"/>
    
    <!-- Transistor labels -->
    <text x="375" y="318" text-anchor="end" class="text-small">B</text>
    <text x="445" y="285" class="text-small">C</text>
    <text x="445" y="350" class="text-small">E</text>
    
    <!-- Emitter to GND -->
    <line x1="425" y1="345" x2="425" y2="595" class="wire-gnd"/>
    
    <!-- Collector to LED -->
    <line x1="425" y1="285" x2="720" y2="285" class="wire"/>
    
    <!-- LED Symbol -->
    <line x1="720" y1="275" x2="720" y2="295" class="led"/>
    <line x1="710" y1="275" x2="730" y2="285" class="led"/>
    <line x1="710" y1="295" x2="730" y2="285" class="led"/>
    <polygon points="710,275 710,295 730,285" fill="none" stroke="#000" stroke-width="2"/>
    <text x="740" y="290" class="text-small text-green" font-weight="bold">GREEN</text>
    <text x="810" y="290" class="text-small">LED</text>
    
    <!-- LED to 330Ω Resistor -->
    <line x1="720" y1="275" x2="720" y2="255" class="wire"/>
    <rect x="700" y="205" width="40" height="50" class="resistor" fill="#fff" transform="rotate(90 720 230)"/>
    <text x="755" y="235" class="text-small">330Ω</text>
    
    <!-- 330Ω to +12V -->
    <line x1="720" y1="205" x2="720" y2="70" class="wire-power"/>
    
    <!-- Button Label -->
    <text x="860" y="290" class="text-small" font-weight="bold">Button 2</text>
  </g>
  
  <!-- Button 3 - BLUE LED Circuit -->
  <g id="button3">
    <!-- 1k Base Resistor -->
    <line x1="210" y1="415" x2="260" y2="415" class="wire"/>
    <rect x="260" y="405" width="50" height="20" class="resistor" fill="#fff"/>
    <text x="285" y="395" text-anchor="middle" class="text-small">1kΩ</text>
    
    <!-- Wire to transistor base -->
    <line x1="310" y1="415" x2="390" y2="415" class="wire"/>
    
    <!-- 2N5551 Transistor Symbol -->
    <circle cx="410" cy="415" r="25" class="transistor"/>
    <line x1="400" y1="400" x2="400" y2="430" class="transistor"/>
    <line x1="398" y1="415" x2="390" y2="415" class="wire"/>
    <line x1="400" y1="405" x2="425" y2="385" class="transistor"/>
    <line x1="400" y1="425" x2="425" y2="445" class="transistor"/>
    <polygon points="422,388 425,385 420,383" fill="#000"/>
    
    <!-- Transistor labels -->
    <text x="375" y="418" text-anchor="end" class="text-small">B</text>
    <text x="445" y="385" class="text-small">C</text>
    <text x="445" y="450" class="text-small">E</text>
    
    <!-- Emitter to GND -->
    <line x1="425" y1="445" x2="425" y2="595" class="wire-gnd"/>
    
    <!-- Collector to LED -->
    <line x1="425" y1="385" x2="780" y2="385" class="wire"/>
    
    <!-- LED Symbol -->
    <line x1="780" y1="375" x2="780" y2="395" class="led"/>
    <line x1="770" y1="375" x2="790" y2="385" class="led"/>
    <line x1="770" y1="395" x2="790" y2="385" class="led"/>
    <polygon points="770,375 770,395 790,385" fill="none" stroke="#000" stroke-width="2"/>
    <text x="800" y="390" class="text-small text-blue" font-weight="bold">BLUE</text>
    <text x="855" y="390" class="text-small">LED</text>
    
    <!-- LED to 330Ω Resistor -->
    <line x1="780" y1="375" x2="780" y2="355" class="wire"/>
    <rect x="760" y="305" width="40" height="50" class="resistor" fill="#fff" transform="rotate(90 780 330)"/>
    <text x="815" y="335" class="text-small">330Ω</text>
    
    <!-- 330Ω to +12V -->
    <line x1="780" y1="305" x2="780" y2="70" class="wire-power"/>
    
    <!-- Button Label -->
    <text x="900" y="390" class="text-small" font-weight="bold">Button 3</text>
  </g>
  
  <!-- Button 4 - WHITE LED Circuit -->
  <g id="button4">
    <!-- 1k Base Resistor -->
    <line x1="210" y1="515" x2="260" y2="515" class="wire"/>
    <rect x="260" y="505" width="50" height="20" class="resistor" fill="#fff"/>
    <text x="285" y="495" text-anchor="middle" class="text-small">1kΩ</text>
    
    <!-- Wire to transistor base -->
    <line x1="310" y1="515" x2="390" y2="515" class="wire"/>
    
    <!-- 2N5551 Transistor Symbol -->
    <circle cx="410" cy="515" r="25" class="transistor"/>
    <line x1="400" y1="500" x2="400" y2="530" class="transistor"/>
    <line x1="398" y1="515" x2="390" y2="515" class="wire"/>
    <line x1="400" y1="505" x2="425" y2="485" class="transistor"/>
    <line x1="400" y1="525" x2="425" y2="545" class="transistor"/>
    <polygon points="422,488 425,485 420,483" fill="#000"/>
    
    <!-- Transistor labels -->
    <text x="375" y="518" text-anchor="end" class="text-small">B</text>
    <text x="445" y="485" class="text-small">C</text>
    <text x="445" y="550" class="text-small">E</text>
    
    <!-- Emitter to GND -->
    <line x1="425" y1="545" x2="425" y2="595" class="wire-gnd"/>
    
    <!-- Collector to LED -->
    <line x1="425" y1="485" x2="840" y2="485" class="wire"/>
    
    <!-- LED Symbol -->
    <line x1="840" y1="475" x2="840" y2="495" class="led"/>
    <line x1="830" y1="475" x2="850" y2="485" class="led"/>
    <line x1="830" y1="495" x2="850" y2="485" class="led"/>
    <polygon points="830,475 830,495 850,485" fill="none" stroke="#000" stroke-width="2"/>
    <text x="860" y="490" class="text-small" font-weight="bold">WHITE</text>
    <text x="915" y="490" class="text-small">LED</text>
    
    <!-- LED to 330Ω Resistor -->
    <line x1="840" y1="475" x2="840" y2="455" class="wire"/>
    <rect x="820" y="405" width="40" height="50" class="resistor" fill="#fff" transform="rotate(90 840 430)"/>
    <text x="875" y="435" class="text-small">330Ω</text>
    
    <!-- 330Ω to +12V -->
    <line x1="840" y1="405" x2="840" y2="70" class="wire-power"/>
    
    <!-- Button Label -->
    <text x="960" y="490" class="text-small" font-weight="bold">Button 4</text>
  </g>
  
  <!-- Common Ground Connection -->
  <line x1="210" y1="595" x2="1080" y2="595" class="wire-gnd"/>
  <line x1="1080" y1="595" x2="1080" y2="200" class="wire-gnd"/>
  <line x1="1080" y1="200" x2="1120" y2="200" class="wire-gnd"/>
  
  <!-- Ground symbol at bottom -->
  <line x1="600" y1="595" x2="600" y2="615" class="wire-gnd"/>
  <line x1="585" y1="615" x2="615" y2="615" stroke="#000" stroke-width="2.5"/>
  <line x1="590" y1="622" x2="610" y2="622" stroke="#000" stroke-width="2"/>
  <line x1="595" y1="629" x2="605" y2="629" stroke="#000" stroke-width="1.5"/>
  <text x="600" y="650" text-anchor="middle" class="text" font-weight="bold">COMMON GND</text>
  
  <!-- Legend Box -->
  <rect x="50" y="680" width="250" height="80" fill="#f8f8f8" stroke="#666" stroke-width="1" rx="3"/>
  <text x="60" y="700" class="text-small" font-weight="bold">Component Values:</text>
  <text x="60" y="720" class="text-small">• Base Resistors: 1kΩ (1/4W)</text>
  <text x="60" y="740" class="text-small">• LED Resistors: 330Ω (1/2W)</text>
  <text x="60" y="755" class="text-small">• Transistors: 2N5551 (NPN, E-B-C)</text>
  
</svg>
